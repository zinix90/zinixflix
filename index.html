<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأفلام والمباريات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 4px solid #1f2937; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- شريط التنقل العلوي -->
    <nav class="bg-gray-800 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex space-x-4 space-x-reverse items-center">
                    <span class="text-2xl font-bold text-blue-500"><i class="fas fa-play-circle ml-2"></i>شامل</span>
                    <div class="hidden md:flex space-x-2 space-x-reverse">
                        <button onclick="switchTab('movies')" class="tab-btn px-4 py-2 rounded-md hover:bg-gray-700 transition active-tab text-blue-400" data-target="movies">🎬 الأفلام</button>
                        <button onclick="switchTab('matches')" class="tab-btn px-4 py-2 rounded-md hover:bg-gray-700 transition" data-target="matches">⚽ المباريات</button>
                    </div>
                </div>
                <button onclick="toggleFavorites()" class="hidden md:flex items-center px-4 py-2 rounded-md hover:bg-gray-700 transition text-yellow-400">
                    <i class="fas fa-heart ml-2"></i>المفضلة <span class="bg-red-600 ml-2 px-2 py-1 rounded text-sm" id="favCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- تبويب الأفلام -->
        <section id="movies" class="tab-content active">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-3xl font-bold">🎬 الأفلام الشهيرة</h2>
                <div class="relative w-full md:w-80">
                    <input type="text" id="searchInput" placeholder="ابحث عن فيلم باسمه أو IMDb ID..." class="w-full bg-gray-800 text-white rounded-full py-2 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <i class="fas fa-search absolute left-4 top-3 text-gray-400"></i>
                </div>
            </div>
            
            <!-- زر البحث -->
            <div class="mb-6 flex gap-2">
                <button onclick="searchMovie()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition font-bold">
                    <i class="fas fa-search ml-2"></i>بحث
                </button>
                <button onclick="loadPopularMovies()" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition font-bold">
                    <i class="fas fa-fire ml-2"></i>الأفلام الشهيرة
                </button>
            </div>

            <!-- حاوية الأفلام -->
            <div id="moviesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- يتم تحميل الأفلام هنا -->
            </div>
        </section>

        <!-- تبويب المباريات -->
        <section id="matches" class="tab-content">
            <h2 class="text-3xl font-bold mb-6">⚽ المباريات الحية</h2>
            
            <div class="mb-6">
                <select id="leagueFilter" class="bg-gray-800 text-white rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">جميع الدوريات</option>
                    <option value="39">الدوري الإنجليزي</option>
                    <option value="140">الدوري الإسباني</option>
                    <option value="78">الدوري الألماني</option>
                    <option value="61">الدوري الإيطالي</option>
                    <option value="2">دوري الأبطال</option>
                </select>
            </div>

            <div id="matchesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- يتم تحميل المباريات هنا -->
            </div>
        </section>

    </main>

    <!-- Modal تفاصيل الفيلم -->
    <div id="movieModal" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-gray-800 rounded-lg max-w-3xl w-full my-8">
            <div class="p-6">
                <button onclick="closeModal()" class="float-left text-2xl cursor-pointer text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
                <div id="modalContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // إعدادات API
        // ==========================================
        const OMDB_API_KEY = 'f65d6f49'; // مفتاح OMDb API
        const OMDB_BASE_URL = 'https://www.omdbapi.com';
        const API_SPORTS_KEY = '38833280cf5b40eb039aee502e096689'; // مفتاح API-Sports
        const API_SPORTS_URL = 'https://api.api-football.com/v3';

        // ==========================================
        // متغيرات عامة
        // ==========================================
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let allMatches = [];
        let popularMovieIds = ['tt0111161', 'tt0068646', 'tt0071562', 'tt0468569', 'tt0050083', 'tt0108052', 'tt0110912', 'tt1375666', 'tt0137523', 'tt0816692'];
        let currentPopularIndex = 0;

        // تحديث عدد المفضلة
        updateFavoriteCount();

        // ==========================================
        // دوال التبديل بين التبويبات
        // ==========================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('text-blue-400'));
            
            document.getElementById(tabId).classList.add('active');
            document.querySelector(`[data-target="${tabId}"]`).classList.add('text-blue-400');

            if (tabId === 'matches' && allMatches.length === 0) {
                fetchMatches();
            }
        }

        // ==========================================
        // دوال الأفلام - OMDb API
        // ==========================================
        async function searchMovie() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            
            if (!searchTerm) {
                showError('moviesContainer', 'الرجاء إدخال اسم فيلم أو IMDb ID');
                return;
            }

            try {
                showLoadingSpinner('moviesContainer');
                
                // إذا كان المدخل يبدأ بـ tt فهو IMDb ID
                let url = `${OMDB_BASE_URL}/?apikey=${OMDB_API_KEY}`;
                
                if (searchTerm.startsWith('tt')) {
                    url += `&i=${searchTerm}`;
                } else {
                    url += `&s=${encodeURIComponent(searchTerm)}&type=movie`;
                }

                const response = await fetch(url);
                const data = await response.json();

                if (data.Response === 'False') {
                    showError('moviesContainer', 'لم يتم العثور على أفلام');
                    return;
                }

                // إذا كان البحث عن فيلم معين (i parameter)
                if (data.Type === 'movie') {
                    renderSingleMovie(data);
                } else if (data.Search) {
                    // إذا كانت نتائج البحث متعددة
                    await renderSearchResults(data.Search);
                }
                
            } catch (error) {
                console.error('خطأ:', error);
                showError('moviesContainer', 'حدث خطأ في البحث. تحقق من الاتصال بالإنترنت.');
            }
        }

        async function renderSearchResults(movies) {
            const container = document.getElementById('moviesContainer');
            
            // جلب تفاصيل كل فيلم
            const detailedMovies = await Promise.all(
                movies.slice(0, 6).map(movie => 
                    fetch(`${OMDB_BASE_URL}/?apikey=${OMDB_API_KEY}&i=${movie.imdbID}`)
                    .then(res => res.json())
                )
            );

            container.innerHTML = detailedMovies.map(movie => createMovieCard(movie)).join('');
        }

        function renderSingleMovie(movie) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = createMovieCard(movie);
        }

        function createMovieCard(movie) {
            if (movie.Response === 'False' || movie.Poster === 'N/A') {
                return '';
            }

            const isFavorite = favorites.some(fav => fav.id === movie.imdbID);

            return `
                <div class="bg-gray-800 rounded-lg overflow-hidden shadow-lg hover:shadow-2xl transition duration-300 flex flex-col h-full relative group">
                    <img src="${movie.Poster}" alt="${movie.Title}" class="w-full h-80 object-cover" onerror="this.src='https://via.placeholder.com/500x750?text=No+Image'">
                    
                    <button onclick="toggleFavorite('${movie.imdbID}', '${movie.Title}', '${movie.Poster}')" class="absolute top-2 right-2 bg-red-600 p-2 rounded-full opacity-0 group-hover:opacity-100 transition z-10">
                        <i class="fas fa-heart ${isFavorite ? '' : 'far'}"></i>
                    </button>
                    
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="font-bold text-lg mb-2 truncate cursor-pointer hover:text-blue-400" onclick="showMovieDetails('${movie.imdbID}')" title="${movie.Title}">
                            ${movie.Title}
                        </h3>
                        
                        <p class="text-sm text-gray-400 mb-2">${movie.Year}</p>
                        
                        <div class="flex justify-between items-center text-sm text-gray-400 mb-3">
                            <span><i class="fas fa-star text-yellow-400 mr-1"></i> ${movie.imdbRating || 'N/A'}</span>
                            <span>${movie.Type === 'movie' ? '🎬' : '📺'}</span>
                        </div>
                        
                        <p class="text-xs text-gray-500 mb-3 line-clamp-2">${movie.Plot || 'لا توجد معلومات'}</p>
                        
                        <button onclick="showMovieDetails('${movie.imdbID}')" class="mt-auto w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded transition font-medium">
                            <i class="fas fa-info-circle ml-1"></i> التفاصيل الكاملة
                        </button>
                    </div>
                </div>
            `;
        }

        async function showMovieDetails(imdbID) {
            try {
                const response = await fetch(`${OMDB_BASE_URL}/?apikey=${OMDB_API_KEY}&i=${imdbID}&plot=full`);
                const movie = await response.json();

                if (movie.Response === 'False') {
                    alert('لم يتم العثور على تفاصيل الفيلم');
                    return;
                }

                const modal = document.getElementById('movieModal');
                const content = document.getElementById('modalContent');

                content.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-6">
                        <img src="${movie.Poster}" alt="${movie.Title}" class="w-full md:w-48 h-auto rounded-lg" onerror="this.src='https://via.placeholder.com/500x750?text=No+Image'">
                        <div class="flex-1">
                            <h2 class="text-3xl font-bold mb-2">${movie.Title}</h2>
                            <p class="text-gray-400 mb-1"><strong>السنة:</strong> ${movie.Year}</p>
                            <p class="text-gray-400 mb-1"><strong>المدة:</strong> ${movie.Runtime}</p>
                            <p class="text-gray-400 mb-3"><strong>النوع:</strong> ${movie.Genre}</p>
                            
                            <div class="bg-gray-900 p-3 rounded mb-3">
                                <p class="text-yellow-400 font-bold"><i class="fas fa-star mr-1"></i> ${movie.imdbRating}/10 (IMDb)</p>
                                <p class="text-sm text-gray-400">عدد التقييمات: ${movie.imdbVotes}</p>
                            </div>
                            
                            <p class="text-gray-300 mb-4 leading-relaxed">${movie.Plot}</p>
                            
                            <div class="space-y-2 text-sm">
                                <p><strong>المخرج:</strong> ${movie.Director}</p>
                                <p><strong>الكتابة:</strong> ${movie.Writer}</p>
                                <p><strong>الممثلون:</strong> ${movie.Actors}</p>
                                <p><strong>الدول:</strong> ${movie.Country}</p>
                                <p><strong>اللغة:</strong> ${movie.Language}</p>
                            </div>
                            
                            <a href="https://www.imdb.com/title/${movie.imdbID}/" target="_blank" class="mt-4 inline-block bg-yellow-500 hover:bg-yellow-600 text-black px-6 py-2 rounded font-bold transition">
                                <i class="fas fa-external-link-alt ml-1"></i> شاهد على IMDb
                            </a>
                        </div>
                    </div>
                `;

                modal.classList.remove('hidden');
            } catch (error) {
                console.error('خطأ:', error);
                alert('فشل تحميل تفاصيل الفيلم');
            }
        }

        function closeModal() {
            document.getElementById('movieModal').classList.add('hidden');
        }

        async function loadPopularMovies() {
            const container = document.getElementById('moviesContainer');
            showLoadingSpinner('moviesContainer');

            try {
                const movies = await Promise.all(
                    popularMovieIds.map(id => 
                        fetch(`${OMDB_BASE_URL}/?apikey=${OMDB_API_KEY}&i=${id}`)
                        .then(res => res.json())
                    )
                );

                container.innerHTML = movies.map(movie => createMovieCard(movie)).join('');
            } catch (error) {
                console.error('خطأ:', error);
                showError('moviesContainer', 'فشل تحميل الأفلام الشهيرة');
            }
        }

        // ==========================================
        // دوال المفضلة
        // ==========================================
        function toggleFavorite(imdbID, title, poster) {
            const index = favorites.findIndex(fav => fav.id === imdbID);
            
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push({ id: imdbID, title, poster });
            }
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavoriteCount();
            
            // إعادة رسم الأفلام الحالية لتحديث أيقونة المفضلة
            const input = document.getElementById('searchInput');
            if (input.value) {
                searchMovie();
            } else {
                loadPopularMovies();
            }
        }

        function updateFavoriteCount() {
            document.getElementById('favCount').textContent = favorites.length;
        }

        function toggleFavorites() {
            if (favorites.length === 0) {
                alert('قائمة المفضلة فارغة 😢');
                return;
            }

            const container = document.getElementById('moviesContainer');
            showLoadingSpinner('moviesContainer');

            setTimeout(() => {
                const favMovies = favorites.map(fav => {
                    return `
                        <div class="bg-gray-800 rounded-lg overflow-hidden shadow-lg hover:shadow-2xl transition duration-300 flex flex-col h-full relative group">
                            <img src="${fav.poster}" alt="${fav.title}" class="w-full h-80 object-cover">
                            
                            <button onclick="toggleFavorite('${fav.id}', '${fav.title}', '${fav.poster}')" class="absolute top-2 right-2 bg-red-600 p-2 rounded-full opacity-0 group-hover:opacity-100 transition z-10">
                                <i class="fas fa-heart"></i>
                            </button>
                            
                            <div class="p-4 flex flex-col flex-grow">
                                <h3 class="font-bold text-lg mb-2 truncate cursor-pointer hover:text-blue-400" onclick="showMovieDetails('${fav.id}')" title="${fav.title}">
                                    ${fav.title}
                                </h3>
                                
                                <button onclick="showMovieDetails('${fav.id}')" class="mt-auto w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded transition font-medium">
                                    <i class="fas fa-info-circle ml-1"></i> التفاصيل
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = favMovies;
            }, 500);
        }

        // ==========================================
        // دوال المباريات - API-Sports
        // ==========================================
        async function fetchMatches() {
            try {
                showLoadingSpinner('matchesContainer');
                
                const today = new Date().toISOString().split('T')[0];
                
                const response = await fetch(`${API_SPORTS_URL}/fixtures?date=${today}`, {
                    headers: {
                        'x-apisports-key': API_SPORTS_KEY
                    }
                });

                if (!response.ok) throw new Error('فشل تحميل المباريات');
                
                const data = await response.json();
                allMatches = data.response || [];
                renderMatches(allMatches);
                
            } catch (error) {
                console.error('خطأ:', error);
                showError('matchesContainer', 'حدث خطأ في تحميل المباريات.');
            }
        }

        function renderMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <i class="fas fa-calendar-times text-4xl mb-3"></i>
                        <p class="text-lg">لا توجد مباريات حية في الوقت الحالي</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = matches.map(match => {
                const { fixture, teams, goals } = match;
                const isLive = fixture.status.short === 'LIVE';
                const statusClass = isLive ? 'border-l-4 border-red-500 bg-red-900/30' : 'border-l-4 border-blue-500';

                return `
                    <div class="bg-gray-800 rounded-lg p-4 ${statusClass} cursor-pointer hover:shadow-lg transition" onclick="toggleMatchDetails('match-${fixture.id}')">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-gray-400">${match.league.name}</span>
                            <div class="flex items-center text-sm font-bold">
                                ${isLive ? `<span class="pulse mr-1 text-red-500">🔴</span> <span class="text-red-500">مباشر</span>` : `<span class="text-gray-400">${fixture.status.elapsed || fixture.status.short}'</span>`}
                            </div>
                        </div>

                        <div class="flex justify-between items-center text-lg font-bold mb-2">
                            <div class="flex items-center w-1/3">
                                ${teams.home.logo ? `<img src="${teams.home.logo}" class="w-6 h-6 ml-2" alt="${teams.home.name}">` : ''}
                                <span class="truncate">${teams.home.name}</span>
                            </div>
                            <div class="bg-gray-900 px-4 py-1 rounded ${isLive ? 'text-red-400' : 'text-white'} tracking-widest">${goals.home || 0} - ${goals.away || 0}</div>
                            <div class="flex items-center justify-end w-1/3">
                                <span class="truncate text-right">${teams.away.name}</span>
                                ${teams.away.logo ? `<img src="${teams.away.logo}" class="w-6 h-6 mr-2" alt="${teams.away.name}">` : ''}
                            </div>
                        </div>

                        <div id="match-${fixture.id}" class="hidden mt-4 pt-4 border-t border-gray-700 text-sm">
                            <div class="space-y-2 text-gray-300">
                                <p><strong>الملعب:</strong> ${fixture.venue?.name || 'غير محدد'}</p>
                                <p><strong>الوقت:</strong> ${new Date(fixture.date).toLocaleString('ar-EG')}</p>
                                <p><strong>الحكم:</strong> ${fixture.referee || 'لم يتم تحديده'}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleMatchDetails(matchId) {
            const element = document.getElementById(matchId);
            if (element) {
                element.classList.toggle('hidden');
            }
        }

        // ==========================================
        // دوال مساعدة
        // ==========================================
        function showLoadingSpinner(containerId) {
            document.getElementById(containerId).innerHTML = `
                <div class="col-span-full flex justify-center py-12">
                    <div class="spinner"></div>
                </div>
            `;
        }

        function showError(containerId, message) {
            document.getElementById(containerId).innerHTML = `
                <div class="col-span-full text-center py-12 text-red-500">
                    <i class="fas fa-exclamation-triangle text-4xl mb-3"></i>
                    <p class="text-lg">${message}</p>
                </div>
            `;
        }

        // ==========================================
        // مستمعو الأحداث
        // ==========================================
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchMovie();
            }
        });

        // تحميل الأفلام الشهيرة عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            loadPopularMovies();
        });

        // إغلاق Modal عند الضغط خارجه
        document.getElementById('movieModal').addEventListener('click', (e) => {
            if (e.target.id === 'movieModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
